<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>価格デザイン試作キット（SeikaPop）</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700&display=swap">
  <style>
    body { font-family: system-ui, sans-serif; background: #e8e6df; color: #222; margin: 0; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .lead { font-size: 14px; line-height: 1.6; max-width: 60em; margin: 0 0 12px; }
    .bar { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; font-size: 14px; }
    #summary { font-weight: 700; }
    #summary.ng, .ng { color: #c00; }
    #summary.ok, .ok { color: #1b7a2e; }
    .row { margin-bottom: 18px; }
    .row h2 { font-size: 15px; margin: 0 0 6px; }
    .cells { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; background: #fff; padding: 6px; border-radius: 6px; }
    canvas { width: 230px; display: block; cursor: zoom-in; }
    canvas.big { width: min(92vw, 720px); cursor: zoom-out; }
    figcaption { font-size: 12px; margin-top: 4px; }
    pre.err { color: #c00; white-space: pre-wrap; font-size: 12px; max-width: 230px; margin: 4px 0 0; }
  </style>
</head>
<body>
  <h1>価格デザイン試作キット</h1>
  <p class="lead">
    青果店のポップ（写真主役の台紙「爆発」）の<b>写真に乗せる金額キャッチだけ</b>を試すページです。下のスクリプトにある
    「ここから〜ここまで」の印のあいだ（<code>PRICE_FONTS</code> と <code>drawPrice</code>）を書き換えて開き直すと、
    全サイズ×全パターンで描き直します。写真・商品名はアプリの配置を真似た見本で、変えられません。
    青い点線が描いてよい範囲（＝写真の枠。キャッチは右下に寄せる）で、はみ出すと赤字で知らせます。画像をクリックすると拡大します。
  </p>
  <div class="bar">
    <label><input type="checkbox" id="showArea" checked> 描いてよい範囲（青い点線）を表示</label>
    <span id="summary">描画中…</span>
  </div>
  <div id="out"></div>

  <script type="module">
// デザインのデータ（アプリの js/catch-design.js の写し。下の drawPrice が使う。使わずに描いてもよい）
const CATCH_DESIGN = {
  "version": 1,
  "order": [
    "burst",
    "num",
    "yen",
    "tax"
  ],
  "fit": {
    "scale": 2.09
  },
  "burst": {
    "points": [
      [
        -290.4,
        -2.7
      ],
      [
        -241.7,
        -35.3
      ],
      [
        -278.3,
        -92.3
      ],
      [
        -229,
        -89.3
      ],
      [
        -230.1,
        -160.1
      ],
      [
        -168.6,
        -112.7
      ],
      [
        -144.2,
        -177.8
      ],
      [
        -107.7,
        -128.9
      ],
      [
        -52.9,
        -185.9
      ],
      [
        -40.7,
        -120.8
      ],
      [
        2,
        -153.4
      ],
      [
        2,
        -2.7
      ]
    ],
    "fill": "#111111",
    "line": "#ffffff",
    "lineWidth": 8
  },
  "num": {
    "font": "Bebas Neue",
    "weight": "400",
    "x": -64.5,
    "y": -49.6,
    "size": 121.7,
    "maxW": 230.4,
    "slant": 0.21,
    "fill": "#e60012",
    "strokes": [
      {
        "color": "#111111",
        "width": 22.6
      },
      {
        "color": "#ffffff",
        "width": 10.4
      }
    ]
  },
  "yen": {
    "font": "Noto Sans JP",
    "weight": "900",
    "x": -66.9,
    "y": -28.6,
    "size": 50,
    "slant": 0.21,
    "fill": "#e60012",
    "strokes": [
      {
        "color": "#111111",
        "width": 16
      },
      {
        "color": "#ffffff",
        "width": 8
      }
    ]
  },
  "tax": {
    "font": "Noto Sans JP",
    "weight": "700",
    "x": -160,
    "y": -15,
    "size": 20,
    "maxW": 330,
    "slant": 0,
    "fill": "#ffffff",
    "strokes": []
  }
};

// ===== ここから: デザイン担当が書き換える範囲 =====
// 使う Google Fonts（デザインの数字・円・税込の書体と太さ。同じものは1つにまとめる）
const PRICE_FONTS = [...new Map(['num', 'yen', 'tax'].map(k => CATCH_DESIGN[k])
  .map(t => [`${t.font}|${t.weight}`, { family: t.font, weight: String(t.weight) }])).values()];

/**
 * キャッチの置き場所: 写真の枠の右下が原点。倍率 k は写真の幅に比例（fit.scale）させる。
 * 写真がとても横長（高さが幅の半分未満）のときだけ、高さに合わせて縮める。
 * 部品の形には左右されない（背景を大きくしたら数字まで縮む、ということが起きないように）。
 * 編集画面も同じ計算で、ドラッグの位置をデザインの座標へ直す。
 */
function catchFrame(area, design = CATCH_DESIGN) {
  const k = Math.min(area.w, area.h * 2) / 1000 * design.fit.scale;
  return { x: area.x + area.w, y: area.y + area.h, k };
}

// 税込の小数（".84"）は2段小さく。「各」は「円」の8割の大きさで、数字の左下に重ねる（数字より手前）
const DECIMAL_SMALL = 0.7, EACH_OF_YEN = 0.8;

/** 小数の部分（".84"）だけ小さくするための分け方。[{ text, k }]（k＝大きさの倍率）。 */
function splitSmall(text) {
  const m = /\.\d+/.exec(text);
  if (!m) return [{ text, k: 1 }];
  return [
    { text: text.slice(0, m.index), k: 1 },
    { text: m[0], k: DECIMAL_SMALL },
    { text: text.slice(m.index + m[0].length), k: 1 },
  ].filter(s => s.text);
}

/** 文字を、外側の縁取りから順に重ねて描く（strokes の先頭がいちばん外）。slant は右上がりの傾き。小数は小さく描く。 */
function layeredText(ctx, text, t, align, scale = 1) {
  const fontOf = k => `${t.weight} ${t.size * scale * k}px "${t.font}", "Hiragino Sans", sans-serif`;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.transform(1, 0, -t.slant, 1, 0, 0);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  const segs = splitSmall(text).map(s => { ctx.font = fontOf(s.k); return { ...s, w: ctx.measureText(s.text).width }; });
  const total = segs.reduce((a, s) => a + s.w, 0);
  let x = align === 'right' ? -total : align === 'center' ? -total / 2 : 0;
  for (const s of segs) { s.x = x; x += s.w; }
  const each = fn => segs.forEach(s => { ctx.font = fontOf(s.k); fn(s); });
  for (const st of t.strokes) {   // 縁取りを全部の字に引いてから塗る（隣の字の塗りを縁取りで消さない）
    if (!st.width) continue;
    ctx.strokeStyle = st.color;
    ctx.lineWidth = st.width * scale;   // 文字を縮めたときは縁取りも同じ割合で細くする
    each(s => ctx.strokeText(s.text, s.x, 0));
  }
  ctx.fillStyle = t.fill;
  each(s => ctx.fillText(s.text, s.x, 0));
  ctx.restore();
}

/**
 * 「各」を、数字（右揃え）の左端の下に、「円」の8割の大きさで重ねる。
 * 書体・色・縁取りは「円」と同じ（数字の書体は和字を持たないことがあり、細い代わりの字になるため）。
 * 置き場所は数字の左端から「各」の大きさの半分だけ左。
 */
function drawEach(ctx, price, design) {
  const t = design.num, text = TEXT_PARTS.num.text(price), scale = fitScale(ctx, text, t);
  ctx.font = `${t.weight} ${t.size * scale}px "${t.font}", "Hiragino Sans", sans-serif`;
  const size = design.yen.size * EACH_OF_YEN;
  const left = t.x - ctx.measureText(text).width - size / 2;
  layeredText(ctx, '各', { ...design.yen, x: left, y: t.y, slant: t.slant }, 'left', EACH_OF_YEN);
}

/** maxW に収まる倍率（収まるなら 1）。 */
function fitScale(ctx, text, t) {
  ctx.font = `${t.weight} ${t.size}px "${t.font}", "Hiragino Sans", sans-serif`;
  const w = ctx.measureText(text).width;
  return w > t.maxW ? t.maxW / w : 1;
}

// キャッチの部品。order（重なり順。先頭がいちばん奥）が無い・壊れているときはこの順
const PART_KEYS = ['burst', 'num', 'yen', 'tax'];
function partOrder(design) {
  const o = design.order;
  return Array.isArray(o) && o.length === PART_KEYS.length && PART_KEYS.every(k => o.includes(k)) ? o : PART_KEYS;
}

// 文字の部品: 何を書くか・どこを基準に揃えるか・最大幅で縮めるか
// 数字は右揃え（桁が増えると左へ伸びる）。税込の併記は総額表示のため必ず描く（税込で入れたときは「(税込)」）
const TEXT_PARTS = {
  num: { text: price => price.main, align: 'right', fit: true },
  yen: { text: () => '円', align: 'left', fit: false },
  tax: { text: price => (price.incl ? `(税込${price.incl}円)` : '(税込)'), align: 'center', fit: true },
};

/**
 * ギザギザを描く。写真の枠の右・下の端に掛かる頂点（端から縁取りの幅ほどの内側まで）は枠の外へ押し出す。
 * 端の手前で止まると、そこに白い縁取りと写真の細い筋が残り、写真の丸めた角から黒い四角がのぞくため。
 */
function drawBurst(ctx, b) {
  const edge = b.lineWidth + 4;
  const out = v => (v > -edge ? Math.max(v, edge) : v);
  ctx.beginPath();
  b.points.map(([x, y]) => [out(x), out(y)]).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.fillStyle = b.fill;
  ctx.fill();
  if (b.lineWidth) {
    ctx.lineJoin = 'miter';
    ctx.lineWidth = b.lineWidth;
    ctx.strokeStyle = b.line;
    ctx.stroke();
  }
}

/**
 * 部品が占める範囲（デザイン単位）。poly は傾きを含めた外形、box はそれを囲む長方形。
 * 編集画面がクリックの当たり判定と、選んだ部品の枠に使う。
 */
function partBounds(ctx, key, design, price) {
  if (key === 'burst') {
    const b = design.burst, pad = b.lineWidth / 2;
    const xs = b.points.map(p => p[0]), ys = b.points.map(p => p[1]);
    const box = { x0: Math.min(...xs) - pad, y0: Math.min(...ys) - pad, x1: Math.max(...xs) + pad, y1: Math.max(...ys) + pad };
    return { poly: b.points, box };
  }
  const t = design[key], spec = TEXT_PARTS[key], text = spec.text(price);
  const scale = spec.fit ? fitScale(ctx, text, t) : 1;
  ctx.save();
  ctx.font = `${t.weight} ${t.size * scale}px "${t.font}", "Hiragino Sans", sans-serif`;
  ctx.textAlign = spec.align;
  const m = ctx.measureText(text);
  ctx.restore();
  const pad = Math.max(0, ...t.strokes.map(s => s.width)) * scale / 2;
  const l = -m.actualBoundingBoxLeft - pad, r = m.actualBoundingBoxRight + pad;
  const top = -m.actualBoundingBoxAscent - pad, bottom = m.actualBoundingBoxDescent + pad;
  // 描くときと同じ傾け方（x を -slant×y ずらす）をして、基準点の位置へ動かす
  const poly = [[l, top], [r, top], [r, bottom], [l, bottom]].map(([x, y]) => [t.x + x - t.slant * y, t.y + y]);
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  return { poly, box: { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) } };
}

/**
 * 金額キャッチを area（写真の枠）の右下に描く。はみ出す分は枠で切る（ギザギザは枠の端に掛かる形）。
 * price.main … 大きく出す数字（"298" "1,980" などカンマ入り）
 * price.incl … 税抜で入れたときの税込額（"321.84"）。税込で入れたときは ""。小数（".84"）は小さく描く
 * price.each … true なら数字の左下に「各」を重ねる（「円」の8割の大きさ）
 * u          … 倍率（幅1080pxの画像で 1）。このデザインは枠の大きさに比例させるので使わない
 * design     … 省略時は catch-design.js（編集画面は編集中のものを渡す）
 */
function drawPrice(ctx, area, price, u, design = CATCH_DESIGN) {
  void u;
  const f = catchFrame(area, design);
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y, area.w, area.h);
  ctx.clip();
  ctx.translate(f.x, f.y);
  ctx.scale(f.k, f.k);
  for (const key of partOrder(design)) {   // 重なり順（後に描くものが手前）
    if (key === 'burst') { drawBurst(ctx, design.burst); continue; }
    const spec = TEXT_PARTS[key], t = design[key], text = spec.text(price);
    layeredText(ctx, text, t, spec.align, spec.fit ? fitScale(ctx, text, t) : 1);
  }
  if (price.each) drawEach(ctx, price, design);   // いちばん手前
  ctx.restore();
}
// ===== ここまで: デザイン担当が書き換える範囲 =====

// ===== 以下は試作キットの仕組み（書き換えない）=====
const CASES = [
  { label: '税抜 298円（基本）', price: { main: '298', incl: '321.84' } },
  { label: '税抜 98円（短い）', price: { main: '98', incl: '105.84' } },
  { label: '税抜 1,980円', price: { main: '1,980', incl: '2,138.4' } },
  { label: '税抜 1,980円・商品名が2行', price: { main: '1,980', incl: '2,138.4' }, twoLines: true },
  { label: '税抜 12,800円', price: { main: '12,800', incl: '13,824' } },
  { label: '税込で入力した 158円（税込額の併記なし。「税込」とだけ添える）', price: { main: '158', incl: '' } },
  { label: '「各」付き 税抜 100円（数字の左下に小さく「各」）', price: { main: '100', incl: '108', each: true } },
  { label: '入力できる最大 1,234,567円', price: { main: '1,234,567', incl: '1,333,332.36' } },
];
const SIZES = [['正方形', 1080, 1080], ['縦 4:5', 1080, 1350], ['縦長 9:16', 1080, 1920]];

function samplePhoto() {
  const cv = document.createElement('canvas');
  cv.width = 1600; cv.height = 1200;
  const c = cv.getContext('2d');
  c.fillStyle = '#6b4a2b'; c.fillRect(0, 0, 1600, 1200);
  for (let i = 0; i < 14; i++) {
    const x = 200 + (i % 5) * 300, y = 250 + Math.floor(i / 5) * 330;
    const g = c.createRadialGradient(x - 40, y - 50, 20, x, y, 170);
    g.addColorStop(0, '#ff8a70'); g.addColorStop(1, '#c41d10');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 160, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2f7d2a'; c.beginPath(); c.ellipse(x, y - 150, 50, 18, 0, 0, Math.PI * 2); c.fill();
  }
  return cv;
}
const PHOTO = samplePhoto();

// アプリの台紙「爆発」と同じ配置で、価格以外を描いて価格の範囲を返す
function drawCell(ctx, W, H, twoLines) {
  const u = W / 1080;
  const F = (s, fam = 'Dela Gothic One', w = 400) => `${w} ${Math.round(s)}px "${fam}", sans-serif`;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 6 * u; ctx.strokeRect(14 * u, 14 * u, W - 28 * u, H - 28 * u);
  ctx.textBaseline = 'alphabetic';
  // アプリと同じく、余白は上・左・右・下（商品名の下）とも 40。写真の高さは商品名の行数で決まる
  const below = (twoLines ? 233 : 121) * u;   // 商品名（104の大きさ）の下端までの高さ
  const box = { x: 40 * u, y: 40 * u, w: W - 80 * u, h: H - 120 * u - below };
  const k = Math.max(box.w / PHOTO.width, box.h / PHOTO.height);
  const sw = box.w / k, sh = box.h / k;
  ctx.save();   // アプリと同じく写真の角を少し丸める（金額キャッチもアプリでは同じ丸みで切られる）
  ctx.beginPath(); ctx.roundRect(box.x, box.y, box.w, box.h, 24 * u); ctx.clip();
  ctx.drawImage(PHOTO, (PHOTO.width - sw) / 2, (PHOTO.height - sh) / 2, sw, sh, box.x, box.y, box.w, box.h);
  ctx.restore();
  const left = 50 * u, base = box.y + box.h + 108 * u;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#1a1a1a';
  ctx.font = F(104 * u);
  if (twoLines) {
    ctx.fillText('シャインマスカット', left, base);
    ctx.fillText('（大粒・種なし）〈1房〉', left, base + 104 * u * 1.08);
  } else {
    ctx.fillText('完熟トマト', left, base);
    const nw = ctx.measureText('完熟トマト').width;
    ctx.font = F(40 * u);
    ctx.fillText('〈1袋〉', left + nw + 6 * u, base);
  }
  return box;   // 金額キャッチは写真の枠の中に描く
}

// 価格だけを透明な画用紙に描いて、範囲の外に色が付いたかを数える
function overflowPixels(W, H, area, price) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d', { willReadFrequently: true });
  drawPrice(c, area, price, W / 1080);
  const data = c.getImageData(0, 0, W, H).data;
  const x0 = Math.floor(area.x) - 2, x1 = Math.ceil(area.x + area.w) + 2;
  const y0 = Math.floor(area.y) - 2, y1 = Math.ceil(area.y + area.h) + 2;
  let n = 0;
  for (let y = 0; y < H; y++) {
    const inY = y >= y0 && y < y1;
    for (let x = 0; x < W; x++) {
      if (inY && x >= x0 && x < x1) continue;
      if (data[(y * W + x) * 4 + 3] > 24) n++;
    }
  }
  return n;
}

function fontsUrl(fonts) {
  const fam = fonts.map(f => `family=${encodeURIComponent(f.family).replace(/%20/g, '+')}:wght@${f.weight || 400}`);
  return `https://fonts.googleapis.com/css2?${fam.join('&')}&display=swap`;
}

async function loadFonts() {
  const sample = '0123456789,.円税込抜各（）()¥';
  const css = new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = fontsUrl(PRICE_FONTS);
    link.onload = resolve; link.onerror = () => reject(new Error('書体の読み込みに失敗: ' + link.href));
    document.head.append(link);
  });
  const all = css.then(() => Promise.all([
    ...PRICE_FONTS.map(f => document.fonts.load(`${f.weight || 400} 40px "${f.family}"`, sample)),
    document.fonts.load('400 40px "Dela Gothic One"', '完熟トマトシャインマスカット（大粒・種なし）〈1袋房〉'),
  ]));
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('書体の読み込みが8秒で終わりませんでした')), 8000));
  return Promise.race([all, timeout]);
}

const cells = [];
function renderAll() {
  const out = document.getElementById('out');
  out.replaceChildren();
  cells.length = 0;
  let bad = 0;
  for (const cs of CASES) {
    const row = document.createElement('div');
    row.className = 'row';
    row.append(Object.assign(document.createElement('h2'), { textContent: cs.label }));
    const wrap = document.createElement('div');
    wrap.className = 'cells';
    for (const [name, W, H] of SIZES) {
      const fig = document.createElement('figure');
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      cv.addEventListener('click', () => cv.classList.toggle('big'));
      const ctx = cv.getContext('2d');
      const area = drawCell(ctx, W, H, cs.twoLines);
      const cap = document.createElement('figcaption');
      try {
        ctx.save();   // アプリと同じく、金額キャッチも写真の丸めた角で切る
        ctx.beginPath(); ctx.roundRect(area.x, area.y, area.w, area.h, 24 * W / 1080); ctx.clip();
        drawPrice(ctx, area, cs.price, W / 1080);
        ctx.restore();
        const n = overflowPixels(W, H, area, cs.price);
        cap.innerHTML = n ? `${name} <span class="ng">⚠ はみ出し ${n}px</span>` : `${name} <span class="ok">✓ 範囲内</span>`;
        if (n) bad++;
      } catch (err) {
        bad++;
        cap.textContent = name;
        fig.append(Object.assign(document.createElement('pre'), { className: 'err', textContent: `エラー: ${err.message}` }));
      }
      if (document.getElementById('showArea').checked) {
        ctx.save();
        ctx.setLineDash([16, 10]); ctx.strokeStyle = 'rgba(0,90,255,0.8)'; ctx.lineWidth = 3;
        ctx.strokeRect(area.x, area.y, area.w, area.h);
        ctx.restore();
      }
      fig.prepend(cv);
      fig.append(cap);
      wrap.append(fig);
    }
    row.append(wrap);
    out.append(row);
  }
  const sum = document.getElementById('summary');
  sum.textContent = bad ? `⚠ 問題のある画像が ${bad} 枚あります` : `✓ 全 ${CASES.length * SIZES.length} 枚とも範囲内`;
  sum.className = bad ? 'ng' : 'ok';
  document.title = bad ? '価格デザイン試作キット（問題あり）' : '価格デザイン試作キット（OK）';
}

document.getElementById('showArea').addEventListener('change', renderAll);
try {
  await loadFonts();
} catch (err) {
  document.querySelector('.lead').insertAdjacentHTML('afterend', `<p class="ng">${err.message}（端末の字で描いています）</p>`);
}
renderAll();
  </script>
</body>
</html>
