<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>価格デザイン試作キット（SeikaPop）</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700&display=swap">
  <style>
    body { font-family: system-ui, sans-serif; background: #e8e6df; color: #222; margin: 0; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .lead { font-size: 14px; line-height: 1.6; max-width: 60em; margin: 0 0 12px; }
    .bar { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; font-size: 14px; }
    #summary { font-weight: 700; }
    #summary.ng, .ng { color: #c00; }
    #summary.ok, .ok { color: #1b7a2e; }
    .row { margin-bottom: 18px; }
    .row h2 { font-size: 15px; margin: 0 0 6px; }
    .cells { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; background: #fff; padding: 6px; border-radius: 6px; }
    canvas { width: 230px; display: block; cursor: zoom-in; }
    canvas.big { width: min(92vw, 720px); cursor: zoom-out; }
    figcaption { font-size: 12px; margin-top: 4px; }
    pre.err { color: #c00; white-space: pre-wrap; font-size: 12px; max-width: 230px; margin: 4px 0 0; }
  </style>
</head>
<body>
  <h1>価格デザイン試作キット</h1>
  <p class="lead">
    青果店のポップ「金額主役」デザインの<b>写真に乗せる金額キャッチだけ</b>を試すページです。下のスクリプトにある
    「ここから〜ここまで」の印のあいだ（<code>PRICE_FONTS</code> と <code>drawPrice</code>）を書き換えて開き直すと、
    全サイズ×全パターンで描き直します。写真・商品名・店名はアプリの配置を真似た見本で、変えられません。
    青い点線が描いてよい範囲（＝写真の枠。キャッチは右下に寄せる）で、はみ出すと赤字で知らせます。画像をクリックすると拡大します。
  </p>
  <div class="bar">
    <label><input type="checkbox" id="showArea" checked> 描いてよい範囲（青い点線）を表示</label>
    <span id="summary">描画中…</span>
  </div>
  <div id="out"></div>

  <script type="module">
// ===== ここから: デザイン担当が書き換える範囲 =====
// 使う Google Fonts（family は Google Fonts の名前どおり、weight は '400' や '700'）
// 元の案は Impact・メイリオ だが、どちらもスマホに無いので近いものに置き換えている
const PRICE_FONTS = [
  { family: 'Anton', weight: '400' },          // Impact に近い縦長の極太数字
  { family: 'Noto Sans JP', weight: '900' },   // 「円」
  { family: 'Noto Sans JP', weight: '700' },   // 税込の併記
];

// 元の案（pop_design.svg, 600×300）の座標を、絵の右下 (600, 300) を原点にして写したもの。
// ギザギザは SVG の translate(-1,16) scale(0.8)（中心 410,190）を当て済み。
const CATCH = {
  burst: [[-383, -6], [-319, -38], [-367, -94], [-287, -82], [-295, -150], [-223, -114], [-191, -178],
    [-143, -130], [-71, -186], [-55, -122], [1, -154], [1, -6]],
  burstLine: 8,                                      // ギザギザの白い縁（10 × 0.8）
  baseY: -44,                                        // 数字と「円」の下端（文字の基準線）
  numRight: -68, numSize: 140, numMaxW: 265,         // 数字は右揃え。これより長いと縮める（帯の左端に掛からない幅）
  yenLeft: -63, yenSize: 50,
  numStroke: [26, 12], yenStroke: [16, 8],           // 縁取り（外の黒、内の白）の太さ
  slant: 0.21,                                       // 斜体の傾き（約12°）
  taxX: -160, taxY: -15, taxSize: 20, taxMaxW: 330,  // 税込の併記（中央揃え・白抜き）
  width: 384, height: 186,                           // キャッチ全体の大きさ（倍率を決めるのに使う）
};

/**
 * 金額キャッチを area（写真の枠）の右下に描く。はみ出す分は枠で切る（ギザギザは枠の端に掛かる形）。
 * price.main … 大きく出す数字（"298" "1,980" などカンマ入り）
 * price.incl … 税抜で入れたときの税込額（"321.84"）。税込で入れたときは ""
 * u          … 倍率（幅1080pxの画像で 1）。この案は枠の大きさに比例させるので使わない
 */
function drawPrice(ctx, area, price, u) {
  void u;
  const C = CATCH;
  // 枠の幅の8割・高さの6割に収まる倍率
  const k = Math.min(area.w * 0.8 / C.width, area.h * 0.6 / C.height);
  const ox = area.x + area.w, oy = area.y + area.h;
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y, area.w, area.h);
  ctx.clip();
  ctx.translate(ox, oy);
  ctx.scale(k, k);

  // 黒いギザギザ（白い縁）
  ctx.beginPath();
  C.burst.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.lineJoin = 'miter';
  ctx.lineWidth = C.burstLine;
  ctx.strokeStyle = '#fff';
  ctx.stroke();

  // 数字と「円」: 外から 黒の太い縁 → 白の縁 → 赤 の3重。基準線を軸に右へ傾けて斜体にする
  const numFont = s => `400 ${s}px "Anton", "Impact", sans-serif`;
  ctx.font = numFont(C.numSize);
  const w = ctx.measureText(price.main).width;
  const numSize = w > C.numMaxW ? C.numSize * C.numMaxW / w : C.numSize;   // 長い数字は左へ伸ばさず縮める
  // shrink: 文字を縮めたときは縁取りも同じ割合で細くする
  const layered = (text, x, strokes, shrink = 1) => {
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';
    ctx.lineWidth = strokes[0] * shrink;
    ctx.strokeText(text, x, 0);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = strokes[1] * shrink;
    ctx.strokeText(text, x, 0);
    ctx.fillStyle = '#e60012';
    ctx.fillText(text, x, 0);
  };
  ctx.save();
  ctx.translate(0, C.baseY);
  ctx.transform(1, 0, -C.slant, 1, 0, 0);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'right';
  ctx.font = numFont(numSize);
  layered(price.main, C.numRight, C.numStroke, numSize / C.numSize);
  ctx.textAlign = 'left';
  ctx.font = `900 ${C.yenSize}px "Noto Sans JP", "Hiragino Sans", sans-serif`;
  layered('円', C.yenLeft, C.yenStroke);
  ctx.restore();

  // 税込の併記（総額表示。税込で入れたときは「(税込)」とだけ）
  const tax = price.incl ? `(税込${price.incl}円)` : '(税込)';
  ctx.font = `700 ${C.taxSize}px "Noto Sans JP", "Hiragino Sans", sans-serif`;
  const tw = ctx.measureText(tax).width;
  if (tw > C.taxMaxW) ctx.font = `700 ${C.taxSize * C.taxMaxW / tw}px "Noto Sans JP", "Hiragino Sans", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.fillText(tax, C.taxX, C.taxY);
  ctx.restore();
}
// ===== ここまで: デザイン担当が書き換える範囲 =====

// ===== 以下は試作キットの仕組み（書き換えない）=====
const CASES = [
  { label: '税抜 298円（基本）', price: { main: '298', incl: '321.84' } },
  { label: '税抜 98円（短い）', price: { main: '98', incl: '105.84' } },
  { label: '税抜 1,980円', price: { main: '1,980', incl: '2,138.4' } },
  { label: '税抜 1,980円・商品名が2行', price: { main: '1,980', incl: '2,138.4' }, twoLines: true },
  { label: '税抜 12,800円', price: { main: '12,800', incl: '13,824' } },
  { label: '税込で入力した 158円（税込額の併記なし。「税込」とだけ添える）', price: { main: '158', incl: '' } },
  { label: '入力できる最大 1,234,567円', price: { main: '1,234,567', incl: '1,333,332.36' } },
];
const SIZES = [['正方形', 1080, 1080], ['縦 4:5', 1080, 1350], ['縦長 9:16', 1080, 1920]];
const SHOP = '青果の見本 本店';

function samplePhoto() {
  const cv = document.createElement('canvas');
  cv.width = 1600; cv.height = 1200;
  const c = cv.getContext('2d');
  c.fillStyle = '#6b4a2b'; c.fillRect(0, 0, 1600, 1200);
  for (let i = 0; i < 14; i++) {
    const x = 200 + (i % 5) * 300, y = 250 + Math.floor(i / 5) * 330;
    const g = c.createRadialGradient(x - 40, y - 50, 20, x, y, 170);
    g.addColorStop(0, '#ff8a70'); g.addColorStop(1, '#c41d10');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 160, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2f7d2a'; c.beginPath(); c.ellipse(x, y - 150, 50, 18, 0, 0, Math.PI * 2); c.fill();
  }
  return cv;
}
const PHOTO = samplePhoto();

// アプリの「金額主役」と同じ配置で、価格以外を描いて価格の範囲を返す
function drawCell(ctx, W, H, twoLines) {
  const u = W / 1080;
  const F = (s, fam = 'Dela Gothic One', w = 400) => `${w} ${Math.round(s)}px "${fam}", sans-serif`;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 6 * u; ctx.strokeRect(14 * u, 14 * u, W - 28 * u, H - 28 * u);
  ctx.textBaseline = 'alphabetic';
  ctx.font = F(46 * u); ctx.textAlign = 'right'; ctx.fillStyle = '#1a1a1a';
  ctx.fillText('10/21(水)', W - 44 * u, 88 * u);
  ctx.font = F(54 * u); ctx.textAlign = 'left';
  const bw = ctx.measureText('本日のおすすめ').width;
  ctx.fillStyle = '#e60012'; ctx.fillRect(40 * u, 32 * u, bw + 48 * u, 74 * u);
  ctx.fillStyle = '#fff'; ctx.fillText('本日のおすすめ', 64 * u, 69 * u + 54 * u * 0.36);
  const box = { x: 40 * u, y: 120 * u, w: W - 80 * u, h: H - 120 * u - (H / W > 1.2 ? 300 : 230) * u };
  const k = Math.max(box.w / PHOTO.width, box.h / PHOTO.height);
  const sw = box.w / k, sh = box.h / k;
  ctx.drawImage(PHOTO, (PHOTO.width - sw) / 2, (PHOTO.height - sh) / 2, sw, sh, box.x, box.y, box.w, box.h);
  const left = 50 * u;
  let y = box.y + box.h + 14 * u;
  ctx.fillStyle = '#1a1a1a';
  if (twoLines) {
    const s = 84 * u;
    ctx.font = F(s);
    ctx.fillText('シャインマスカット', left, y + s * 0.9);
    ctx.fillText('（大粒・種なし）〈1房〉', left, y + s * 0.9 + s * 1.08);
    y += s * 0.9 + s * 1.08 + 10 * u;
  } else {
    const s = 104 * u;
    ctx.font = F(s);
    ctx.fillText('完熟トマト', left, y + s * 0.9);
    const nw = ctx.measureText('完熟トマト').width;
    ctx.font = F(40 * u);
    ctx.fillText('〈1袋〉', left + nw + 6 * u, y + s * 0.9);
    y += s * 0.9 + 10 * u;
  }
  if (H / W > 1.2) {
    ctx.font = F(40 * u, 'Zen Maru Gothic', 700); ctx.fillStyle = '#5a3a1a';
    ctx.fillText('甘さ自慢！ サラダにどうぞ', left, y + 44 * u);
    y += 56 * u;
  }
  ctx.font = F(28 * u, 'Zen Maru Gothic', 700); ctx.fillStyle = '#777';
  ctx.fillText(SHOP, left, H - 40 * u);
  return box;   // 金額キャッチは写真の枠の中に描く
}

// 価格だけを透明な画用紙に描いて、範囲の外に色が付いたかを数える
function overflowPixels(W, H, area, price) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d', { willReadFrequently: true });
  drawPrice(c, area, price, W / 1080);
  const data = c.getImageData(0, 0, W, H).data;
  const x0 = Math.floor(area.x) - 2, x1 = Math.ceil(area.x + area.w) + 2;
  const y0 = Math.floor(area.y) - 2, y1 = Math.ceil(area.y + area.h) + 2;
  let n = 0;
  for (let y = 0; y < H; y++) {
    const inY = y >= y0 && y < y1;
    for (let x = 0; x < W; x++) {
      if (inY && x >= x0 && x < x1) continue;
      if (data[(y * W + x) * 4 + 3] > 24) n++;
    }
  }
  return n;
}

function fontsUrl(fonts) {
  const fam = fonts.map(f => `family=${encodeURIComponent(f.family).replace(/%20/g, '+')}:wght@${f.weight || 400}`);
  return `https://fonts.googleapis.com/css2?${fam.join('&')}&display=swap`;
}

async function loadFonts() {
  const sample = '0123456789,.円税込抜（）()¥';
  const css = new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = fontsUrl(PRICE_FONTS);
    link.onload = resolve; link.onerror = () => reject(new Error('書体の読み込みに失敗: ' + link.href));
    document.head.append(link);
  });
  const all = css.then(() => Promise.all([
    ...PRICE_FONTS.map(f => document.fonts.load(`${f.weight || 400} 40px "${f.family}"`, sample)),
    document.fonts.load('400 40px "Dela Gothic One"', '完熟トマト本日のおすすめ'),
    document.fonts.load('700 40px "Zen Maru Gothic"', SHOP),
  ]));
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('書体の読み込みが8秒で終わりませんでした')), 8000));
  return Promise.race([all, timeout]);
}

const cells = [];
function renderAll() {
  const out = document.getElementById('out');
  out.replaceChildren();
  cells.length = 0;
  let bad = 0;
  for (const cs of CASES) {
    const row = document.createElement('div');
    row.className = 'row';
    row.append(Object.assign(document.createElement('h2'), { textContent: cs.label }));
    const wrap = document.createElement('div');
    wrap.className = 'cells';
    for (const [name, W, H] of SIZES) {
      const fig = document.createElement('figure');
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      cv.addEventListener('click', () => cv.classList.toggle('big'));
      const ctx = cv.getContext('2d');
      const area = drawCell(ctx, W, H, cs.twoLines);
      const cap = document.createElement('figcaption');
      try {
        ctx.save();
        drawPrice(ctx, area, cs.price, W / 1080);
        ctx.restore();
        const n = overflowPixels(W, H, area, cs.price);
        cap.innerHTML = n ? `${name} <span class="ng">⚠ はみ出し ${n}px</span>` : `${name} <span class="ok">✓ 範囲内</span>`;
        if (n) bad++;
      } catch (err) {
        bad++;
        cap.textContent = name;
        fig.append(Object.assign(document.createElement('pre'), { className: 'err', textContent: `エラー: ${err.message}` }));
      }
      if (document.getElementById('showArea').checked) {
        ctx.save();
        ctx.setLineDash([16, 10]); ctx.strokeStyle = 'rgba(0,90,255,0.8)'; ctx.lineWidth = 3;
        ctx.strokeRect(area.x, area.y, area.w, area.h);
        ctx.restore();
      }
      fig.prepend(cv);
      fig.append(cap);
      wrap.append(fig);
    }
    row.append(wrap);
    out.append(row);
  }
  const sum = document.getElementById('summary');
  sum.textContent = bad ? `⚠ 問題のある画像が ${bad} 枚あります` : `✓ 全 ${CASES.length * SIZES.length} 枚とも範囲内`;
  sum.className = bad ? 'ng' : 'ok';
  document.title = bad ? '価格デザイン試作キット（問題あり）' : '価格デザイン試作キット（OK）';
}

document.getElementById('showArea').addEventListener('change', renderAll);
try {
  await loadFonts();
} catch (err) {
  document.querySelector('.lead').insertAdjacentHTML('afterend', `<p class="ng">${err.message}（端末の字で描いています）</p>`);
}
renderAll();
  </script>
</body>
</html>
